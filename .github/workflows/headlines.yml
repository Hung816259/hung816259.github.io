name: Refresh headlines

on:
  schedule:
    - cron: "0 11,23 * * *"   # 6 AM and 6 PM Central (CDT)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: headlines
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch headlines
        run: python3 tools/fetch_headlines.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/headlines.json
          git diff --cached --quiet || git commit -m "Refresh headlines"
          git push
