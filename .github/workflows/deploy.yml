name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A29FB5: ${{ secrets.A29FB5 }}
          B2F820: ${{ secrets.B2F820 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A29FB5', '')
          tag_b = os.environ.get('B2F820', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- 13d8644a0e242c17 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 820a9945aaa5138a59884136a5a9370e2c8cb21c -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
